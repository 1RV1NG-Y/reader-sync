[[permission]]
identifier = "allow-read-dropped-file"
description = "Read an EPUB or PDF the user just dropped onto the window."
commands.allow = ["read_dropped_file"]

[[permission]]
identifier = "allow-library"
description = "Use the library: the sync core's rpc, and book bytes in and out."
commands.allow = ["rpc", "import_book", "book_file", "book_file_base64"]

[[permission]]
identifier = "allow-background"
description = "Desktop: whether closing the window keeps the app syncing in the tray, and starting at login."
commands.allow = ["keeps_running_in_background", "start_at_login", "set_start_at_login"]
