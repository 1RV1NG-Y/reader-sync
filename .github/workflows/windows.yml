name: Windows
# Builds and tests reader-sync on real Windows (MSVC). Linux checks alone don't establish
# that the Windows build works. The app build joins this workflow at integration (PLAN.md §8).
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Core tests (storage, books, positions, pairing, multi-device sync)
        run: cargo test -p readersync-core
