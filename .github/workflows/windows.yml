name: Windows
# Builds and tests reader-sync on real Windows (MSVC) and uploads the app (and, from main, publishes
# it as the "Latest build" release). Linux checks alone don't establish that the Windows build works.
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Core tests (storage, books, positions, files, pairing, multi-device sync)
        run: cargo test -p readersync-core
      - run: npm ci
        working-directory: app
      - name: App tests
        run: npm test
        working-directory: app
      - name: Build the app
        run: npx tauri build --no-bundle
        working-directory: app
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-win | Out-Null
          Copy-Item target/release/reader-sync.exe dist-win/
          Copy-Item LICENSE dist-win/
      - uses: actions/upload-artifact@v4
        with:
          name: reader-sync-windows-x64
          path: dist-win/
          if-no-files-found: error
  release:
    # Every green build of main replaces the "Latest build" release, so the newest Windows app is
    # always at https://github.com/1RV1NG-Y/reader-sync/releases/latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reader-sync-windows-x64
          path: dist-win
      - name: Replace the Latest build release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # A slower run for an older commit mustn't replace a newer build.
          if [ "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" != "$GITHUB_SHA" ]; then
            echo "main has moved on; leaving the release to the newer run."; exit 0
          fi
          printf '%s\n' "Built from ${GITHUB_SHA:0:7}: ${MESSAGE%%$'\n'*}" "" \
            "**Windows:** download \`reader-sync.exe\` and put it in place of the old one. If reader-sync is running, quit it first from its tray icon (by the clock)." \
            > notes.md
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist-win/reader-sync.exe --target "$GITHUB_SHA" --latest \
            --title "Latest build" --notes-file notes.md
